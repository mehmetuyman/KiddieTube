# /etc/nginx/snippets/kiddietube-headers.conf
# Security headers for kids.tinyapps.dev. Included at server level AND in
# every location that sets its own add_header (nginx drops inherited headers
# in such locations). CSP allows only this origin plus what the kids' player
# needs from YouTube (API script, embeds, thumbnails).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; img-src 'self' data: https://img.youtube.com https://i.ytimg.com; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://www.youtube.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
