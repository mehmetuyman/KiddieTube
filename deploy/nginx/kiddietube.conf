# /etc/nginx/sites-available/kiddietube  (symlink into sites-enabled)
# kids.tinyapps.dev: static web app + /api proxied to the Kiddie Tube API.
# Same TLS setup as the existing tinyapps.dev server block (Cloudflare in
# front; origin certificate at /etc/nginx/ssl/).

# Access log without secrets [review R3-3]: password links carry a token in
# the path, and the pages they open carry tokens/invitation ids in the query,
# as does /parent?next=<one of those pages> [review R3-6].
# The Referer is left out too (it would repeat those URLs for page assets).
map $request_uri $kiddietube_log_uri {
    ~^/api/auth/reset-password/          "/api/auth/reset-password/[token]";
    ~^/(join|accept|reset-password|parent)\?  "/$1?[redacted]";
    default                              $request_uri;
}
log_format kiddietube_redacted '$remote_addr - [$time_local] "$request_method $kiddietube_log_uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name kids.tinyapps.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kids.tinyapps.dev;

    # Today: the self-signed certificate shared with tinyapps.dev (Cloudflare
    # SSL mode "Full"). Planned: a Cloudflare Origin CA certificate and "Full
    # (strict)"; see deploy/README.md "Cloudflare origin hardening".
    ssl_certificate     /etc/nginx/ssl/self.crt;
    ssl_certificate_key /etc/nginx/ssl/self.key;

    access_log /var/log/nginx/access.log kiddietube_redacted;

    # Real visitor IPs (rate limits are per visitor, not per Cloudflare edge)
    include snippets/kiddietube-cloudflare-realip.conf;

    root /opt/kiddietube/apps/web/dist;
    index index.html;

    # Security headers (see the snippet for why it's repeated per location)
    include snippets/kiddietube-headers.conf;

    # API. X-Forwarded-For is overwritten, not appended to: a client-sent
    # value must never reach the API (it trusts only this proxy).
    location /api/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 256k;
    }

    # Password links (/api/auth/reset-password/<token>). If the API is down,
    # nginx's error log would record the full request line, token included
    # [review R3-7]; upstream failures are logged at "error", so this location
    # logs only "crit" and above. (The access log is masked by the map above.)
    location ^~ /api/auth/reset-password/ {
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 256k;
    }

    # Bulk import looks up each link on YouTube (up to 50 links): allow longer
    location ~ ^/api/v1/families/[^/]+/videos/import$ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 256k;
    }

    # Service worker, manifest and the app page must never be cached by the
    # browser/CDN, or updates would be delayed.
    location = /sw.js              { include snippets/kiddietube-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /registerSW.js      { include snippets/kiddietube-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /manifest.webmanifest { include snippets/kiddietube-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /index.html         { include snippets/kiddietube-headers.conf; add_header Cache-Control "no-cache" always; }

    # Hashed build assets can be cached forever
    location /assets/ {
        try_files $uri =404;
        include snippets/kiddietube-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Single-page app: /parent, /join, /accept, /reset-password -> index.html
    location / {
        try_files $uri $uri/ /index.html;
        include snippets/kiddietube-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
